# Версію веде python-semantic-release ([tool.semantic_release] нижче): вручну не змінювати.
[project]
name = "yourpathukma"
version = "0.1.0"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
# До 1.0.0 «breaking» піднімає minor, а не major.
major_on_zero = false
allow_zero_version = true
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# Правило бонусу Лаб 8: refactor: дає patch (за замовчуванням реліз роблять лише feat і fix/perf).
[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
# Власні шаблони: заголовок `## [X.Y.Z] - РРРР-ММ-ДД` (Keep a Changelog) замість `## vX.Y.Z (дата)`.
template_dir = ".github/changelog-templates"
# У журнал потрапляють лише змістовні зміни; службові типи комітів (і сам реліз-коміт) пропускаємо.
exclude_commit_patterns = ['''^(ci|docs|test|chore|build|style)(\(.+\))?!?:''']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "tests/*"]
