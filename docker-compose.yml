# Лише локальна розробка. Пароль задайте в .env; не використовуйте цей compose у production.
# Використання ШІ: Codex обмежив PostgreSQL localhost для #219; перевірка: docker compose config.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yourpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yourpath
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourpath"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
