# Локальна PostgreSQL для розробки: `docker compose up -d db`, далі
#   export DATABASE_URL=postgresql://yourpath:yourpath@localhost:5432/yourpath
#   uvicorn src.api.main:app --reload --port 3000   (міграції й демо-дані застосовуються при старті)
#
# Використання ШІ: файл створено за допомогою Claude (Claude Code). Перевірка: запуск тестів проти
# PostgreSQL 16 у Docker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yourpath
      POSTGRES_PASSWORD: yourpath
      POSTGRES_DB: yourpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourpath"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
