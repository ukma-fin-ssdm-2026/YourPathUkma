# Локальна PostgreSQL для розробки: `docker compose up -d db`, далі
#   export DATABASE_URL=postgresql://yourpath:yourpath@localhost:5432/yourpath
#   uvicorn src.api.main:app --reload --port 3000   (міграції й демо-дані застосовуються при старті)
#
# Увесь застосунок у контейнері (фронтенд + API + PostgreSQL), для перевірки образу перед деплоєм:
#   JWT_SECRET=<мінімум 32 символи> docker compose --profile app up --build
#   далі http://localhost:8000 (Swagger: /api-docs). Токен для Swagger: python -m scripts.issue_token <email>
#
# Використання ШІ: файл створено за допомогою Claude (Claude Code). Перевірка: запуск тестів проти
# PostgreSQL 16 у Docker; сервіс app: збірка образу й запуск контейнера.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yourpath
      POSTGRES_PASSWORD: yourpath
      POSTGRES_DB: yourpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourpath"]
      interval: 5s
      retries: 10

  # Профіль app: звичайний `docker compose up -d db` його не запускає
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        VITE_MS_CLIENT_ID: ${VITE_MS_CLIENT_ID:-}
        VITE_MS_TENANT: ${VITE_MS_TENANT:-organizations}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development            # локально без HTTPS; у production потрібні MS_* і COOKIE_SECURE=1
      DATABASE_URL: postgresql://yourpath:yourpath@db:5432/yourpath
      JWT_SECRET: ${JWT_SECRET:-}     # порожній секрет зупиняє старт із поясненням
      COOKIE_SECURE: "0"
      CORS_ORIGINS: http://localhost:8000
      ALLOWED_REDIRECT_URIS: http://localhost:8000/auth/callback
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
