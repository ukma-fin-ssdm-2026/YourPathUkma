components:
  schemas:
    AcademicCategory:
      type: string
      enum:
      - normative
      - professional
      - free_choice
      title: AcademicCategory
    AcademicHistoryResponse:
      properties:
        years:
          items:
            $ref: '#/components/schemas/AcademicYearGroup'
          type: array
          title: Years
          description: Записи, згруповані за навчальним роком
      type: object
      required:
      - years
      title: AcademicHistoryResponse
    AcademicRecordInput:
      properties:
        academic_year:
          type: integer
          maximum: 2030.0
          minimum: 2015.0
          title: Academic Year
          examples:
          - 2024
        course_year:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Course Year
          examples:
          - 1
        course_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Course Id
          description: Дисципліна з каталогу; null — вказати title і credits
        title:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 2
          - type: 'null'
          title: Title
          description: Обов'язково, якщо course_id = null
        trimester:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Trimester
          examples:
          - 1
        credits:
          anyOf:
          - type: number
            maximum: 30.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Credits
          description: Обов'язково, якщо course_id = null
        category:
          $ref: '#/components/schemas/AcademicCategory'
      type: object
      required:
      - academic_year
      - course_year
      - trimester
      - category
      title: AcademicRecordInput
    AcademicRecordResponse:
      properties:
        id:
          type: integer
          title: Id
          examples:
          - 310
        academic_year:
          type: integer
          title: Academic Year
          description: Рік початку навчального року
          examples:
          - 2024
        course_year:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Course Year
          examples:
          - 1
        course_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Course Id
          description: null, якщо дисципліни вже немає в каталозі
          examples:
          - 301
        title:
          type: string
          title: Title
          examples:
          - Алгоритми та структури даних
        trimester:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Trimester
          description: 1 — осінь, 2 — весна, 3 — літо
          examples:
          - 1
        credits:
          type: number
          title: Credits
          examples:
          - 6.0
        category:
          $ref: '#/components/schemas/AcademicCategory'
        source:
          $ref: '#/components/schemas/RecordSource'
        verified:
          type: boolean
          title: Verified
          description: Підтверджено адміністратором
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - academic_year
      - course_year
      - title
      - trimester
      - credits
      - category
      - source
      - verified
      - created_at
      title: AcademicRecordResponse
    AcademicYearGroup:
      properties:
        academic_year:
          type: integer
