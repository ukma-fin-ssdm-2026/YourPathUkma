openapi: 3.1.0
info:
  title: YourPathUkma API
  description: 'REST API платформи для побудови індивідуального навчального плану
    студентів НаУКМА: плани вибіркових дисциплін, каталог дисциплін, контроль кредитного
    навантаження.


    **Автентифікація:** JWT Bearer (Microsoft 365 SSO). У поточній заглушці приймається
    будь-який непорожній токен: натисніть Authorize і введіть, наприклад, `test`.'
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Local development server (localhost)
paths:
  /api/v1/plans:
    post:
      tags:
      - Plans
      summary: Створити новий індивідуальний план (чернетку)
      description: 'Створює план вибіркових дисциплін для поточного студента. Серверна
        валідація: унікальність дисциплін, ліміт вільного вибору (25 кредитів), заборона
        плану лише з вільного вибору, конфлікт з нормативними дисциплінами деканату.'
      operationId: create_plan_api_v1_plans_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: План успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Plans
      summary: Отримати список планів студента
      description: Повертає плани поточного студента з offset-пагінацією та фільтрами
        за статусом і навчальним роком.
      operationId: list_plans_api_v1_plans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Максимальна кількість планів на сторінку
          default: 20
          title: Limit
        description: Максимальна кількість планів на сторінку
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість планів, які треба пропустити
          default: 0
          title: Offset
        description: Кількість планів, які треба пропустити
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PlanStatus'
          - type: 'null'
          description: Фільтр за статусом плану
          title: Status
        description: Фільтр за статусом плану
      - name: academic_year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2030
            minimum: 2024
          - type: 'null'
          description: Фільтр за навчальним роком
          title: Academic Year
        description: Фільтр за навчальним роком
      responses:
        '200':
          description: Список планів отримано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlansResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/plans/{plan_id}:
    get:
      tags:
      - Plans
      summary: Отримати план за ID
      description: Детальна інформація про конкретний індивідуальний план поточного
        студента.
      operationId: get_plan_api_v1_plans__plan_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Унікальний ідентифікатор плану
          examples:
          - 1
          title: Plan Id
        description: Унікальний ідентифікатор плану
      responses:
        '200':
          description: План знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Доступ заборонено: ресурс належить іншому студенту'
          content:
            application/json:
              example:
                code: PLAN_FORBIDDEN
                message: Цей план належить іншому студенту
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              example:
                code: PLAN_NOT_FOUND
                message: План з ID 5 не знайдено
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Plans
      summary: Оновити індивідуальний план
      description: Повне оновлення плану. Дозволено лише для планів у статусі `draft`,
        інакше — 409.
      operationId: update_plan_api_v1_plans__plan_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Унікальний ідентифікатор плану
          examples:
          - 1
          title: Plan Id
        description: Унікальний ідентифікатор плану
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '200':
          description: План успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Доступ заборонено: ресурс належить іншому студенту'
          content:
            application/json:
              example:
                code: PLAN_FORBIDDEN
                message: Цей план належить іншому студенту
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              example:
                code: PLAN_NOT_FOUND
                message: План з ID 5 не знайдено
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Конфлікт: дія неможлива в поточному стані ресурсу'
          content:
            application/json:
              example:
                code: PLAN_NOT_EDITABLE
                message: Редагувати можна лише план у статусі draft
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Plans
      summary: Видалити індивідуальний план
      description: Видаляє план, лише якщо він у статусі `draft`, інакше — 409.
      operationId: delete_plan_api_v1_plans__plan_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Унікальний ідентифікатор плану
          examples:
          - 1
          title: Plan Id
        description: Унікальний ідентифікатор плану
      responses:
        '204':
          description: План успішно видалено
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Доступ заборонено: ресурс належить іншому студенту'
          content:
            application/json:
              example:
                code: PLAN_FORBIDDEN
                message: Цей план належить іншому студенту
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              example:
                code: PLAN_NOT_FOUND
                message: План з ID 5 не знайдено
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Конфлікт: дія неможлива в поточному стані ресурсу'
          content:
            application/json:
              example:
                code: PLAN_NOT_DELETABLE
                message: Видаляти можна лише план у статусі draft
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/plans/validate:
    post:
      tags:
      - Plans
      summary: Перевірити план без збереження
      description: 'Для живих підказок у конструкторі. Завжди 200, якщо тіло відповідає
        схемі; порушення правил повертаються в `errors`. Поки без БД: не перевіряються
        каталог, нормативні дисципліни, документ деканату, вільний вибір попередніх
        років і попередження про навантаження.'
      operationId: validate_plan_api_v1_plans_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPayload'
        required: true
      responses:
        '200':
          description: Перевірку виконано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanValidationResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
      security:
      - HTTPBearer: []
  /api/v1/plans/{plan_id}/submit:
    post:
      tags:
      - Plans
      summary: Подати індивідуальний план
      description: Переводить план зі статусу draft у submitted. Перевіряє всі нормативи.
      operationId: submit_plan_api_v1_plans__plan_id__submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          examples:
          - 1
          title: Plan Id
      responses:
        '200':
          description: План успішно подано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Доступ заборонено: ресурс належить іншому студенту'
          content:
            application/json:
              example:
                code: PLAN_FORBIDDEN
                message: Цей план належить іншому студенту
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              example:
                code: PLAN_NOT_FOUND
                message: План з ID 5 не знайдено
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Конфлікт: дія неможлива в поточному стані ресурсу'
          content:
            application/json:
              example:
                code: PLAN_NOT_SUBMITTABLE
                message: Подати можна лише план у статусі draft
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: PLAN_VALIDATION_FAILED
                message: План не проходить перевірку нормативів
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/plans/{plan_id}/export:
    get:
      tags:
      - Plans
      summary: Експорт плану в PDF
      description: Фіксація і експорт плану у форматі PDF (use-case 16).
      operationId: export_plan_api_v1_plans__plan_id__export_get
      security:
      - HTTPBearer: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          examples:
          - 1
          title: Plan Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: Формат експорту (поки лише pdf)
          default: pdf
          title: Format
        description: Формат експорту (поки лише pdf)
      responses:
        '200':
          description: Файл PDF
          content:
            application/json:
              schema: {}
            application/pdf: {}
        '401':
          description: 'Неавторизований доступ: відсутній або некоректний JWT-токен'
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                message: Відсутній або некоректний токен авторизації
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Доступ заборонено: ресурс належить іншому студенту'
          content:
            application/json:
              example:
                code: PLAN_FORBIDDEN
                message: Цей план належить іншому студенту
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              example:
                code: PLAN_NOT_FOUND
                message: План з ID 5 не знайдено
                details: []
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: Невалідні вхідні дані
                details:
                - field: items.0.credits
                  message: Input should be greater than 0
                request_id: req_3f9a1c7e2b4d4a6e
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/disciplines:
    get:
      tags:
      - Disciplines
      summary: Отримати каталог дисциплін
      description: Каталог дисциплін з фільтрами (напрямок, триместр, викладач, кредити,
        рік, тип) та offset-пагінацією.
      operationId: list_disciplines_api_v1_disciplines_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Максимальна кількість дисциплін на сторінку
          default: 20
          title: Limit
        description: Максимальна кількість дисциплін на сторінку
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість дисциплін, які треба пропустити
          default: 0
          title: Offset
        description: Кількість дисциплін, які треба пропустити
      - name: direction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 50
          - type: 'null'
          description: Напрямок розвитку, напр. Data Science
          title: Direction
        description: Напрямок розвитку, напр. Data Science
      - name: trimester
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 3
            minimum: 1
          - type: 'null'
          description: Триместр (1 — осінь, 2 — весна, 3 — літо)
          title: Trimester
        description: Триместр (1 — осінь, 2 — весна, 3 — літо)
      - name: instructor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 100
          - type: 'null'
          description: Частина імені викладача
          title: Instructor
        description: Частина імені викладача
      - name: min_credits
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Мінімум кредитів
          title: Min Credits
        description: Мінімум кредитів
      - name: max_credits
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Максимум кредитів
          title: Max Credits
        description: Максимум кредитів
