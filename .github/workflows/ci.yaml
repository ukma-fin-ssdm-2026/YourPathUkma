# Використання ШІ: файл створено за допомогою Claude (Anthropic). Перевірка: ті самі кроки
# (генерація, git diff, pytest) запущено локально; перший прогін у GitHub Actions після пушу.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourpath_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: pip install ruff && ruff check src tests scripts mcp
      - name: Security scan (bandit)
        run: pip install "bandit[toml]" && bandit -c pyproject.toml -r src mcp scripts tests
      - name: Generate OpenAPI from code
        run: python scripts/generate_openapi.py
      - name: Fail if committed spec is out of date
        run: git diff --exit-code docs/api/
      - name: Tests with coverage report
        run: pytest -q --cov=src --cov-fail-under=80 --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

  frontend:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
      - run: npm run gen:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
