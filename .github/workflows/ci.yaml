# Використання ШІ: файл створено за допомогою Claude (Anthropic). Перевірка: ті самі кроки
# (генерація, git diff, pytest) запущено локально; перший прогін у GitHub Actions після пушу.
# Лаб 10, бонус 3 (Claude): тести розділено на швидкий набір (на кожному PR і push) та повільний (`-m slow`, лише
# після злиття в main або вручну). Перевірка: YAML розібрано PyYAML, логіку умов звірено з документацією Actions;
# перший прогін відбувається в GitHub Actions.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'Labs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourpath_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: "pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt"
      - name: Lint (ruff)
        run: "pip install --only-binary :all: ruff==0.17.0 && ruff check src tests scripts mcp"
      - name: Security scan (bandit)
        run: 'pip install --only-binary :all: "bandit[toml]==1.9.4" && bandit -c pyproject.toml -r src mcp scripts tests'
      - name: Generate OpenAPI from code
        run: python scripts/generate_openapi.py
      - name: Fail if committed spec is out of date
        run: git diff --exit-code docs/api/
      - name: Fast suite (unit and API tests, every PR and push)
        shell: bash
        run: |
          start=$SECONDS
          status=0
          pytest -q -m "not slow" --ignore=tests/reliability --cov=src --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80 || status=$?
          {
            echo "### Test suite durations"
            echo "| Suite | Runs on | Seconds | Exit code |"
            echo "| --- | --- | ---: | ---: |"
            echo "| Fast (not slow) | every PR and push | $((SECONDS - start)) | $status |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Slow suite (real PostgreSQL integration, after merge to main)
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          REQUIRE_POSTGRES: "1"
        run: |
          start=$SECONDS
          status=0
          pytest -q -m slow -rs --cov=src --cov-branch --cov-append --cov-report=xml --cov-report=html || status=$?
          echo "| Slow (slow) | push to main, manual run | $((SECONDS - start)) | $status |" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

  frontend:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
      - run: npm run gen:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      