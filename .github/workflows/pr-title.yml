# Використання ШІ: файл створено за допомогою Claude (Anthropic) для бонусу «Автоматизований реліз» (Лаб 8).
# Перевірка: YAML розібрано локально; перший прогін — на PR із цим файлом.
#
# PR зливаємо squash-merge, тож назва PR стає повідомленням коміту на main, а release-please читає саме його.
# Назва має бути в форматі Conventional Commits: feat:, fix:, refactor:, docs:, test:, chore:, ci:, build:, perf:.
name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: [self-hosted, linux]
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            build
            perf
          requireScope: false
