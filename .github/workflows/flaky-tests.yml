# Використання ШІ: Codex додав ручний запуск п'яти повторів на одному раннері.
# Перевірка: pre-commit, тести аналізатора JUnit і ручний запуск після злиття.
name: Flaky tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab10-flaky-tests
  cancel-in-progress: false

jobs:
  repeat-tests:
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourpath_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.lock"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Run five rounds on the same commit
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/yourpath_test
        shell: bash
        run: |
          reports="$(mktemp -d "${RUNNER_TEMP}/lab10-junit.XXXXXX")"
          echo "LAB10_REPORTS=$reports" >> "$GITHUB_ENV"
          for round in 1 2 3 4 5; do
            echo "::group::Round $round on $GITHUB_SHA"
            backend_status=0
            python -m pytest -q -p no:cacheprovider --junitxml="$reports/backend-$round.xml" || backend_status=$?
            printf '%s\n' "$backend_status" > "$reports/backend-$round.exit"
            frontend_status=0
            (cd frontend && npm test -- --reporter=default --reporter=junit --outputFile.junit="$reports/frontend-$round.xml") || frontend_status=$?
            printf '%s\n' "$frontend_status" > "$reports/frontend-$round.exit"
            echo "::endgroup::"
          done
      - name: Compare test results
        if: ${{ !cancelled() && env.LAB10_REPORTS != '' }}
        shell: bash
        run: |
          python scripts/flaky_test_reports.py "$LAB10_REPORTS" --sha "$GITHUB_SHA" |
            tee "$LAB10_REPORTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit evidence
        if: ${{ !cancelled() && env.LAB10_REPORTS != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-reports
          path: ${{ env.LAB10_REPORTS }}
