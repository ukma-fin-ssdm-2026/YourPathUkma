# Використання ШІ: файл створено за допомогою Claude (Claude Code). Перевірка: той самий крок
# (`pytest tests/reliability`) запущено локально; перший прогін у GitHub Actions після пушу.
#
# Окрема перевірка PR: лише тести надійності з tests/reliability/ (Лаб 9, бонус).
# Щоб вона стала обов'язковою, у ruleset гілки main додайте required status check `reliability-tests`.
name: Reliability

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  reliability-tests:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Sonar S8544: залежності ставимо лише з lock-файлу з хешами (див. AGENTS.md §9.2)
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.lock"
      - name: Reliability tests
        # Без TEST_DATABASE_URL conftest.py бере тимчасову SQLite-базу, окремий сервіс Postgres не потрібен
        run: pytest tests/reliability -q -p no:cacheprovider
