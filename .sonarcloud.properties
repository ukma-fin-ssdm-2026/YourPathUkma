# Автоматичний аналіз SonarCloud. Очищені сторінки САЗ у tests/fixtures/saz це знімки чужої розмітки
# (ми її не контролюємо): правила доступності HTML та дублювання до них не застосовуються.
# docs/testing/coverage — згенерований звіт покриття (HTML/JS), не код проєкту: виключено з аналізу та дублювання (Лаб 8).
sonar.exclusions=tests/fixtures/**,docs/testing/coverage/**
sonar.cpd.exclusions=tests/fixtures/**,docs/testing/coverage/**
